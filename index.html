function curChap(){ const c = CHAPS.findLast(c=>sec(c[1])<=det.t) || CHAPS[0]; return CHAPS.indexOf(c)+1+' '+c[0]; }
function curLine(){ let k=0; LINES.forEach((l,i)=>{ if(sec(l[0])<=det.t) k=i; }); return k; }

// 只刷新播放器相关区域，避免整页重绘打断阅读
// —— 转写跟随 ——
// 用户主动滚动（滚轮 / 触摸 / 拖动滚动条 / 键盘）→ 暂停跟随；当前句离开可视区 → 显示“回到播放位置”，箭头指向当前句方向；
// 用户自己滚回能看到当前句 → 按钮消失，正在播放时恢复跟随；点按钮 → 平滑滚回当前句并恢复跟随。程序滚动不算用户滚动。
let autoUntil = 0;
function lineVisible(el){ const p=$('#tpane'); const top=el.offsetTop-p.scrollTop; return top>=0 && top+el.offsetHeight<=p.clientHeight-48; }
function autoScroll(el, smooth){ const p=$('#tpane'); autoUntil=Date.now()+(smooth?700:250);
  p.scrollTo({top:Math.max(0, el.offsetTop - p.clientHeight/3), behavior:smooth?'smooth':'auto'});
  setTimeout(updateFollowBtn, smooth?720:260); }
function updateFollowBtn(){
  const btn=$('#followBtn'); if(!btn) return;
  const el=document.querySelector('.line.cur');
  if(!el || lineVisible(el)){ btn.hidden=true; if(el && det.playing) det.follow=true; return; }
  if(det.follow) { btn.hidden=true; return; }
  const below = el.offsetTop - $('#tpane').scrollTop > 0;
  $('#followArrow').setAttribute('d', below ? 'M12 5v14M6 13l6 6 6-6' : 'M12 19V5M6 11l6-6 6 6');
  btn.hidden=false;
}
function paintPlayer(scroll){
  if(page!=='detail' || !$('#ptime')) return;
  $('#ptime').textContent = fmt(det.t)+' / '+fmt(DUR);
  $('#pbar').style.width = (det.t/DUR*100)+'%';
  $('#ppBtn').textContent = det.playing?'❚❚':'▶';
  $('#curchap').textContent = '当前章节：'+curChap();
  const k = curLine();
  document.querySelectorAll('.line').forEach((el,i)=>el.classList.toggle('cur', i===k && (det.playing || det.t>0)));
  const pane=$('#tpane'), el=document.querySelector(`.line[data-line="${k}"]`);
  if(det.follow && scroll && el && !lineVisible(el)){ autoScroll(el); }
  updateFollowBtn();
}
function setPlaying(on){
  det.playing = on; clearInterval(tick);
  if(on){ tick = setInterval(()=>{ det.t = Math.min(DUR, det.t + det.speed); if(det.t>=DUR) setPlaying(false); paintPlayer(true); }, 1000); }
  paintPlayer(true);
}
// 定位原话：只在右侧闪一下，不改播放进度（PRD 6.3.5）
// 点左侧时间点 / 章节：右侧跳到对应句子并从该处开始播放，转写跟随
function locate(ts){
  let k=0; LINES.forEach((l,i)=>{ if(sec(l[0])<=sec(ts)) k=i; });
  det.t = sec(ts); det.follow = true;
  setPlaying(true);
  const el=document.querySelector(`.line[data-line="${k}"]`);
  if(el){ autoScroll(el, true); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  $('#followBtn').hidden = true;
}
function bindDetail(){
  const pane=$('#tpane'); if(!pane) return;
  const userScroll = ()=>{ if(Date.now()<autoUntil) return; det.follow=false; };
  ['wheel','touchstart'].forEach(ev=>pane.addEventListener(ev, userScroll, {passive:true}));
  pane.addEventListener('pointerdown', e=>{ if(e.offsetX > pane.clientWidth) userScroll(); });   // 拖动滚动条
  pane.addEventListener('keydown', e=>{ if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].includes(e.key)) userScroll(); });
  pane.addEventListener('scroll', ()=>{ if(Date.now()>=autoUntil) updateFollowBtn(); }, {passive:true});
  $('#speed').addEventListener('change', e=>{ det.speed=Number(e.target.value); if(det.playing) setPlaying(true); });
  $('#prog').addEventListener('click', e=>{ const r=e.currentTarget.getBoundingClientRect(); det.t=Math.round((e.clientX-r.left)/r.width*DUR); det.follow=true; paintPlayer(true); });
  $('#tpane').tabIndex = 0;
  paintPlayer(false);
}

// 采纳勾选的项；没勾选的保留为待核对（不再“其余忽略”）。全部处理完才算这次接待核对完成
function doConfirm(){
  const picks = [...UPDATES, ...SUGG].filter(x=>det.pick[x.id] && !det.handled[x.id]);
  if(!picks.length) return;
  let upN = 0, toToday = 0, toLater = 0;
  det.added = det.added || [];
  picks.forEach(x=>{
    det.handled[x.id] = 'ok';
    if(UPDATES.includes(x)){ upN++;
      if(x.id==='u4'){ const lv=(x.neu.trim()[0]||'').toUpperCase(), lf=FAMILIES.find(f=>f[0]==='刘洋'); if(lf && 'ABC'.includes(lv)) lf[3]=lv; }     // 采纳后才改档案里的等级
      return; }
    const s = x, md = (s.due||'').slice(5);
    if(s.id==='s1'){ toToday++; return; }   // 与已有逾期待办合并，不新增
    todos.push({id:s.id,t:s.t,src:'11-19 接待 '+s.ts,due: md?(md==='11-19'?'今天':md):'',done:false});
    // 今天到期的进首页“待办”；以后到期的记在客户档案「下一步」，到期当天再进入待办
    if(md && md<='11-19'){ ACTIONS.push({id:s.id, fam:'刘洋', tag:'今日', cls:'', t:'刘洋 '+s.t, d:'来自 11-19 接待', ops:['done']}); det.added.push(s.id); toToday++; }
    else { LATER.push({id:s.id, fam:'刘洋', text:s.t, md:md||'未定日期'}); toLater++; }
  });
  det.pick = {}; settleUpdates();
  render();
  const parts = [], left = pendN();
  if(upN) parts.push(`${upN} 项资料已更新到档案`);
  if(toToday) parts.push(`${toToday} 条待办进入待办`);
  if(toLater) parts.push(`${toLater} 条记入客户档案「下一步」`);
  if(left) parts.push(`还有 ${left} 项稍后处理`);
  toast(parts.join('，'));
}

  box.innerHTML = (inp.dataset.pc==='all'?'<button type="button" class="cg-o" data-combo-pick="">全部顾问</button>':'')

  const isC = a => (a.ops||[]).some(o=>o==='confirm'||o==='link');
  const row = a => { const d=done.has(a.id), todo=(a.ops||[]).includes('done');
    const ops = (a.ops||[]).map(o=>({
      prep:'<button class="btn pri" type="button" data-prep>来访准备</button>',
      done: d ? `<button class="go" type="button" data-td-undo="${a.id}">撤销</button>` : `<button class="go" type="button" data-td-defer="${a.id}">改期</button><button class="go" type="button" data-td-edit="${a.id}">编辑</button>`,
      confirm:`<button class="btn pri" type="button" data-detail="update">${d?'已核对':'去核对'}</button>`,
      link:'<button class="btn" type="button" data-link="11-19 11:30">关联</button>'
    })[o]).join('');
    return `<div class="row trow${d?' done':''}">

function saveFamEdit(name, main){
  const old = nf.edit, f = FAMILIES.find(x=>x[0]===old);
  if(name!==old && FAMILIES.some(x=>x[0]===name)){ toast('已有同名客户，请换个称呼或用备注区分'); return; }
  if(name!==old) nf.members.forEach(m=>{ if(m.name.startsWith(old+'的')) m.name = name+m.name.slice(old.length); });   // 主要联系人改名后，“××的妻子”跟着改
  const ms = nf.members.filter(m=>m.name), tel = main.phone ? main.phone.slice(0,3)+'****'+main.phone.slice(-4) : (main.ph||'');
  // 历史接待的到访人按成员对应关系迁移：改名或更换主要联系人后仍指向同一个人
  RECORDS.filter(r=>r[3]===old).forEach(r=>{ const names=visitorsOf(r).map(w=>w[0]); VISITORS[r[0]] = names.map(n=>ms.findIndex(m=>(m.orig||m.name)===n)).filter(i=>i>=0); });
  delete MEMBERS[old]; MEMBERS[name] = ms.map((m,i)=>[m.name, i===0?'本人':(m.rel||'关系未确认')]);
  f[1] = main.name+(tel?' '+tel:''); f[3] = nf.lv; f.memo = nf.memo;
  if(name!==old){ f[0]=name; RECORDS.forEach(r=>{ if(r[3]===old) r[3]=name; }); REVIEW_LOG.forEach(x=>{ if(x.fam===old) x.fam=name; });
    ACTIONS.forEach(a=>{ if(actFam(a)===old){ a.t=a.t.replace(old,name); if(a.fam) a.fam=name; } }); cv.sel=name; }
  closeModal(); render(); toast('已保存');
}

}

// —— 客户档案 › 家庭分析：购房进度条（这户走到哪一步、卡在哪）+ 一句判断 ——
const STAGES = ['首次到访','看过样板间','谈到价格付款','约定下次','定房意向'];
const STG_SET = { '陈建国':[1,1,1,1,0], '刘洋':[1,1,1,1,0], '郑丽':[1,1,1,0,0], '许晴':[1,1,1,1,1] };     // 手写样例；其余由接待记录推导
const STG_BLOCK = { '刘洋':'答应的尺寸图还没发' };      // 卡点与“当前顾虑”不同时单独写
const STG_NOTE = {
  '陈建国':'价格和付款都谈过了，离定房只差两件事：车位管理费给明确答复、首付分期给个说法。今天复访是推进的机会。',
  '刘洋':'需求已经具体，预算也有弹性，约了周六带老人再来；现在卡在答应的尺寸图还没发。',
  '郑丽':'在两房和三房之间犹豫，核心是约 30 万的总价差；还没有约下次，时间一长容易冷掉。',
  '何雪':'两次来访都在算首付和月供，还没有给出测算方案；建议下次带上分期说明。',
  '许晴':'客户表示资金到位本周就可以定，首付节点申请在等经理批复。'
};
function famStages(p){
  if(STG_SET[p.name]) return STG_SET[p.name].map(Boolean);
  const txt = p.visits.map(v=>v.purpose).join('；'), nx = p.f[5];
  return [p.visits.length>0, /样板间|看.{0,6}[房楼]|儿童房|空间|采光|楼层|户型/.test(txt), /总价|首付|月供|付款|贷款|预算|费/.test(txt+p.f[4]), /复访/.test(nx), false];
}
function stageHtml(p){
  const on = famStages(p), cur = on.lastIndexOf(true), next = on.indexOf(false, cur+1), c = STG_BLOCK[p.name] || p.f[4];
  const tip = i => on[i] ? (i===0 && p.visits.length ? `${STAGES[i]}|${p.visits[p.visits.length-1].t.slice(0,5)} 第 1 次来访` : i===3 && /复访/.test(p.f[5]) ? `${STAGES[i]}|${p.f[5]}` : `${STAGES[i]}|已到这一步`) : `${STAGES[i]}|还没到这一步`;
  const note_ = STG_NOTE[p.name] || (cur<0 ? '还没有来访记录。' : `来访 ${p.visits.length} 次，走到“${STAGES[cur]}”${c&&c!=='—'?`；当前顾虑是${c}`:''}${p.f[5]==='—'?'，还没有约下次':''}。`);
  return `<div class="stg">
    <div class="stg-bar">${STAGES.map((s,i)=>`<div class="stg-s${on[i]?' on':''}${i===cur?' cur':''}" data-tip="${tip(i)}"><i></i><span>${s}</span></div>`).join('')}</div>
    ${cur>=0 && cur<STAGES.length-1 && c && c!=='—' ? `<div class="stg-block"><span class="tag warn">当前顾虑</span><b>${c}</b><span class="k">已到“${STAGES[cur]}”，还没到“${STAGES[next<0?cur+1:next]}”</span></div>` : ''}
    <p class="stg-note">${note_}</p>
  </div>
  ${note('<b>家庭分析改为“进度条 + 一句判断”</b>：这张卡回答“这户走到哪一步了、卡在哪”。进度条五个阶段（<b>阶段划分为暂定，待案场给口径</b>）：首次到访 → 看过样板间 → 谈到价格付款 → 约定下次 → 定房意向。已到的阶段实心打勾，最远到达的阶段高亮；中间没经历的阶段保持空心（如没看样板间就谈了价格），不强行补齐。前四个阶段来自客观记录：接待次数、纪要的带看动线和购房需求字段、是否约了下次；<b>“定房意向”需要 AI 判断并由顾问确认</b>，走“客户更新”的确认流程。悬停阶段看是哪次来访到达的。进度条下方：<b>卡点</b>（当前主要顾虑，说明卡在哪两个阶段之间）+ 灵悟的一句判断。<b>版面</b>：家庭分析和“下一步”合成<b>一张卡</b>，左边“现在怎么样”（进度条、卡点、判断），右边“我要做什么”（下一步），中间一条细分隔线；不再是两张等高的卡（下一步往往只有一两条，单独成卡会留大片空白）。原来进度条下面的分条分析（需求变化、未解决问题、家人各自关心什么）与下方页签内容重复，已去掉，详情在页签里看；这张卡压到一屏的四分之一以内，把空间让给下面的来访时间线。')}`;
}

  let h = location.hash.slice(1); if(!h) return; try{ h = decodeURIComponent(h); }catch(e){}
  const q = Object.fromEntries(h.split('&').map(s=>{ const i=s.indexOf('='); return i<0 ? [s,''] : [s.slice(0,i), s.slice(i+1)]; }));
  if(['login','advisor','admin'].includes(q.role)){ role=q.role; document.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.role===role)); }
  if(q.site && SITES[q.site]) site=q.site;
  if(['home','clients','records','review','devices','quota'].includes(q.page)) page=q.page;
  if(q.sel && FAMILIES.some(f=>f[0]===q.sel)){ cv.sel=q.sel; page='clients'; }
  if(q.fam) at.fam=q.fam; if(q.work) at.work=q.work; if(q.data) at.data=q.data; if(q.brief) at.brief=q.brief;
  if(q.rid){ det.rid=q.rid; det.prev='records'; page='detail'; } if(q.dtab) det.tab=q.dtab;
  if(q.day) rv.day=q.day; if(q.dv) dv.tab=q.dv; if(q.qt) qv.tab=q.qt;
  document.body.classList.toggle('nobar', q.bar==='0');
}
applyHash();
if(typeof addEventListener==='function') addEventListener('hashchange', ()=>{ applyHash(); render(); window.scrollTo(0,0); });

render();
</script>

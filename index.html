<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵悟 · 案场接待助手</title>
<style>
:root{
  color-scheme: light;
  --ink:#1E2B2F; --muted:#5E6B6E; --faint:#8A9699; --line:#DCE3E0; --line-soft:#EAEFED;
  --paper:#FFFFFF; --canvas:#F2F5F3;
  --brand:#0F6B52; --brand-ink:#0B4F3D; --brand-tint:#E5F1EC; --brand-soft:#F3F9F6;
  --warn:#A9501B; --warn-tint:#FBEFE6;
  --note:#FFF6D6; --note-line:#E6C85A;
  --r-lg:14px; --r-md:10px; --r-sm:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);
  font:14px/1.6 "PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 原型预览条：仅用于切换角色和批注，不属于产品界面 */
.preview{position:sticky;top:0;z-index:20;display:flex;gap:16px;align-items:center;
  padding:8px 20px;background:#2A3538;color:#D9E2E0;font-size:12px}
.preview .seg{display:flex;background:#1E2729;border-radius:8px;padding:2px}
.preview .seg button{border:0;background:transparent;color:#C5D0CE;padding:4px 12px;border-radius:6px}
.preview .seg button[aria-pressed="true"]{background:#F2F5F3;color:#1E2B2F;font-weight:600}
.preview label{display:flex;gap:6px;align-items:center;cursor:pointer}
.preview .spacer{flex:1}

.app{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:calc(100vh - 40px)}
.side{background:var(--paper);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:40px;height:calc(100vh - 40px);overflow-y:auto;align-self:start}
.app{transition:grid-template-columns .18s}
.clp{border:0;background:transparent;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.clp:hover{background:var(--brand-soft);color:var(--brand)}
.clp svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
/* 收起态：只显示图标，悬停提示名称；分组悬停弹出二级菜单 */
body.collapsed .app{grid-template-columns:64px minmax(0,1fr)}
body.collapsed .side{padding:20px 8px}
body.collapsed .logo{justify-content:center;padding:0 0 18px}
body.collapsed .logo .lbl-t{display:none}
body.collapsed .nav .lbl,body.collapsed .nav .chev{display:none}
body.collapsed .nav button{justify-content:center;padding:10px 0}
body.collapsed .side{overflow:visible;z-index:30}
.navgrp{position:relative}
body.collapsed .navgrp .children{display:none!important}
body.collapsed .navgrp:hover .children,body.collapsed .navgrp:focus-within .children{display:grid!important;position:absolute;left:52px;top:0;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 10px 30px rgba(30,43,47,.12);padding:6px;min-width:150px;z-index:30;margin:0}
body.collapsed .navgrp .children button{padding:7px 10px;justify-content:flex-start}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;padding:0 8px 24px}
.logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand);
  color:#fff;font-style:normal;font-size:15px}
.nav button{display:flex;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;
  color:var(--muted);margin-bottom:2px}
.nav button[aria-current="page"]{background:var(--brand-tint);color:var(--brand-ink);font-weight:600}
.nav button{align-items:center;gap:10px}
.nav .ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 一级分组：可展开收起 */
.nav .grp .chev{margin-left:auto;width:14px;height:14px;transition:transform .15s}
.nav .grp[aria-expanded="true"] .chev{transform:rotate(90deg)}
.nav .grp.in-group{color:var(--brand-ink);font-weight:600}
/* 二级菜单：缩进、字号略小 */
.nav .children{display:grid;gap:2px;margin:2px 0 6px}
.nav .children button{padding:7px 10px 7px 38px;font-size:13.5px}
.nav .children[hidden]{display:none}

main{padding:22px 28px 48px;min-width:0;max-width:1440px}
.top{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.top .date{color:var(--muted);margin-top:2px}
.top .grow{flex:1}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);
  border-radius:999px;padding:3px 12px 3px 3px;font-size:13px}
.who b{font-weight:600}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.period{display:flex;border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden}
.period button{border:0;background:transparent;padding:5px 14px;color:var(--muted)}
.period button[aria-pressed="true"]{background:var(--brand);color:#fff}
.search{display:flex;gap:6px}
.search input{width:240px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;background:var(--paper)}

/* 工牌状态胶囊（依赖硬件心跳，见批注） */
.device{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted);
  background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 14px}
.device .dot{width:8px;height:8px;border-radius:50%;background:#2E9E6E;display:inline-block;margin-right:6px}
.device b{color:var(--ink);font-weight:600}

.banner{display:flex;gap:12px;align-items:center;background:var(--warn-tint);color:var(--warn);
  border-radius:var(--r-md);padding:8px 14px;margin-bottom:16px;font-size:13px}
.banner .bi{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.banner b{font-weight:650}
.banner .bsep{width:1px;height:14px;background:currentColor;opacity:.25}
.banner{white-space:nowrap;flex-wrap:wrap}
.banner button{margin-left:auto;border:0;background:transparent;color:var(--warn);text-decoration:underline}

/* —— 灵悟简报：本页唯一“大声”的元素 —— */
.brief{position:relative;background:var(--paper);border-radius:var(--r-lg);padding:16px 22px 10px;
  margin-bottom:18px;border:1px solid var(--line);box-shadow:inset 4px 0 0 0 transparent}
.brief-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.brief-mark{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--brand-tint);color:var(--brand-ink);
  border-radius:999px;padding:2px 10px 2px 4px;font-size:12px;font-weight:600}
.brief-mark i{width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;
  font-style:normal;font-size:11px}
.brief-head .meta{color:var(--faint);font-size:12px}
.brief-head .brief-time{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap}
.ev{display:inline-flex;align-items:center;gap:3px;vertical-align:2px;margin-left:6px;border:1px solid var(--line);
  background:var(--brand-soft);color:var(--brand-ink);border-radius:var(--r-sm);padding:0 7px;font-size:12px;line-height:20px}
.ev:hover{border-color:var(--brand)}
.go{display:inline-block;margin-left:6px;border:0;background:transparent;color:var(--brand);font-size:13px;
  text-decoration:underline;text-underline-offset:3px;vertical-align:1px}

/* 通用区块：按层级区分，不用统一卡片 */
.grid{display:grid;gap:18px}
.g-admin-1{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g-admin-2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g-adv-1{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;min-width:0}
.block.flat{background:transparent;border:0;padding:4px 2px}
.bh{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.bh h2{margin:0;font-size:16px;font-weight:650}
.bh .meta{color:var(--faint);font-size:12px}
.bh .link{margin-left:auto;border:0;background:transparent;color:var(--brand);font-size:13px}

/* 关键数字：竖排列表而不是四张大卡 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:18px}
.kpi{padding:14px 18px;border-left:1px solid var(--line-soft);text-align:left;background:transparent;border-top:0;border-right:0;border-bottom:0}
.kpi:first-child{border-left:0}
.kpi:hover{background:var(--brand-soft)}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.3}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi .s .bad{color:var(--warn)}

/* 行动清单 */
.rows{display:grid}
.row{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;
  border-top:1px solid var(--line-soft)}
.row:first-child{border-top:0}
.row.done{opacity:.45}
.row.done .t{text-decoration:line-through}
.tag{display:inline-block;font-size:12px;border-radius:var(--r-sm);padding:1px 7px;white-space:nowrap;
  background:var(--line-soft);color:var(--muted);text-align:center}
.tag.warn{background:var(--warn-tint);color:var(--warn)}
.tag.ai{background:var(--brand-tint);color:var(--brand-ink)}
.tag.solid{background:var(--brand);color:#fff}
.row .t{font-weight:600}
.row .d{color:var(--muted);font-size:13px}
.row .ops{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 12px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink);color:#fff}

/* 客户卡点：横向条 */
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 48px;gap:12px;align-items:center;border:0;
  background:transparent;text-align:left;padding:7px 6px;border-radius:8px}
.bar:hover{background:var(--brand-soft)}
.bar .track{height:10px;background:var(--line-soft);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--brand);border-radius:5px}
.bar .c{font-weight:600;text-align:right}
.bar .q{grid-column:2 / 4;font-size:12px;color:var(--muted);margin-top:-2px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--faint);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr.flag td{background:#FFFBF7}
td .bad{color:var(--warn);font-weight:600}
.lv{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:700;font-size:12px;
  background:var(--brand);color:#fff}
.lv.b{background:#5E8F80}
.lv.c{background:#A8B5B1}
.lv.pend{background:transparent;border:1.5px dashed var(--brand);color:var(--brand)}

/* 趋势图（内联 SVG） */
.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* 复访准备卡 */
.prep dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;margin:0}
.prep dt{color:var(--faint);font-size:13px}
.prep dd{margin:0}
.prep .say{margin-top:12px;background:var(--brand-soft);border-radius:var(--r-md);padding:10px 12px;font-size:13px}
.prep .say b{color:var(--brand-ink)}

/* 最近接待 */
.rec{padding:12px 0;border-top:1px solid var(--line-soft)}
.rec:first-of-type{border-top:0}
.rec .h{display:flex;align-items:center;gap:8px}
.rec .h b{font-size:15px}
.rec .h .meta{color:var(--faint);font-size:12px}
.rec .h .btn{margin-left:auto}
.rec p{margin:4px 0 6px;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 9px;color:var(--muted);line-height:22px}

.dist{display:flex;gap:4px;height:12px;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.dist span{display:block;height:100%}

/* 设计批注 */
.note{display:none;margin:0 0 12px;background:var(--note);border:1px dashed var(--note-line);border-radius:var(--r-md);
  padding:8px 12px;font-size:12.5px;line-height:1.65;color:#5A4A12}
.note b{color:#3F3205}
body.notes .note{display:block}

/* 抽屉：依据原话 */
.mask{position:fixed;inset:0;background:rgba(30,43,47,.28);opacity:0;pointer-events:none;transition:opacity .18s;z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);background:var(--paper);z-index:31;
  transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;
  box-shadow:-12px 0 32px rgba(30,43,47,.12)}
.open .mask{opacity:1;pointer-events:auto}
.open .drawer{transform:none}
.drawer header{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0 0 4px;font-size:17px}
.drawer header p{margin:0;color:var(--muted);font-size:13px}
.drawer .x{position:absolute;right:14px;top:14px;border:0;background:transparent;font-size:20px;color:var(--faint)}
.drawer .body{padding:12px 20px 24px;overflow:auto}
.q{border-top:1px solid var(--line-soft);padding:12px 0}
.q:first-child{border-top:0}
.q .m{font-size:12px;color:var(--faint);margin-bottom:4px}
.q blockquote{margin:0 0 6px;padding:6px 10px;border-radius:8px;background:var(--brand-soft);font-size:14px}
.q .who2{font-size:12px;color:var(--brand-ink);font-weight:600}
.drawer textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:var(--r-md);padding:10px;font:inherit;line-height:1.7}
.drawer .tip{font-size:12px;color:var(--faint);margin:8px 0 12px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:999px;font-size:13px;transition:.2s;z-index:40;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ============ 纪要详情 ============ */
.dhead{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 20px;margin-bottom:14px}
.dhead .bar1{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.dhead .bar1 .sp{flex:1}
.dhead h1{margin:10px 0 4px;font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dhead .meta2{color:var(--muted);font-size:13px}
.dhead .spk{margin-top:6px;font-size:13px;color:var(--muted)}
.dhead .spk b{color:var(--ink);font-weight:600}
.notice{background:var(--note);border-radius:var(--r-md);padding:6px 12px;font-size:12.5px;color:#5A4A12;margin-bottom:12px}

.confirmbar{display:flex;align-items:center;gap:14px;background:var(--brand-tint);border:1px solid #C9E2D8;border-radius:var(--r-lg);
  padding:12px 18px;margin-bottom:14px}
.confirmbar .ic{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.confirmbar .tx{flex:1}
.confirmbar .tx b{color:var(--brand-ink)}
.confirmbar .tx div{font-size:12.5px;color:var(--muted)}
.confirmbar.ok{background:var(--paper);border-color:var(--line)}

.d1{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin-bottom:14px;align-items:stretch}
.d2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.d2>.block{display:flex;flex-direction:column;height:640px}
.d2 .pane{flex:1;height:auto;min-height:0}
.d2 .tpane{flex:1;height:auto;min-height:0;padding-bottom:56px}
.ov{display:grid;grid-template-columns:max-content 1fr;gap:8px 12px;margin:0}
.ov dt{color:var(--faint);font-size:13px;padding-top:1px}
.ov dd{margin:0}
.ts{border:0;background:transparent;color:var(--brand);padding:0 2px;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.todo{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line-soft)}
.todo:first-of-type{border-top:0}
.todo input{margin-top:4px;accent-color:var(--brand)}
.todo.done .tt{text-decoration:line-through;color:var(--faint)}
.todo .src{font-size:12px;color:var(--faint)}
.cmp{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.cmp h3{margin:0 0 6px;font-size:14px}
.cmp li{margin:0 0 6px;font-size:13px}
.cmp ul{margin:0;padding-left:18px}

.tabs2{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:-4px 0 0}
.tabs2 button{border:0;background:transparent;padding:6px 0 9px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button[aria-selected="true"]{color:var(--ink);font-weight:650;border-color:var(--brand)}
.tabs2 .cnt{display:inline-block;background:var(--warn-tint);color:var(--warn);border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}
.pane{height:560px;overflow:auto;padding:12px 4px 40px 0;position:relative}
.pane h3{font-size:14px;margin:14px 0 6px}
.pane p{margin:0 0 8px}
.pane ul{margin:0 0 8px;padding-left:18px}
.pane li{margin-bottom:6px}
.chap{background:var(--brand-soft);border-radius:var(--r-md);padding:10px 12px;margin-bottom:8px}
.chap .h{display:flex;gap:10px;align-items:baseline}
.chap .h b{flex:1}
.chap p{margin:4px 0 0;color:var(--muted);font-size:13px}
.upd{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:8px}
.upd label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.upd input{margin-top:5px;accent-color:var(--brand)}
.upd .k{color:var(--faint);font-size:12.5px}
.upd .diff{display:grid;grid-template-columns:4em 1fr;gap:2px 8px;font-size:13px;margin:4px 0 0 22px}
.upd .diff .old{color:var(--faint);text-decoration:line-through}
.upd .diff .new{color:var(--brand-ink);font-weight:600}
.lbl{font-size:12px;border-radius:4px;padding:0 6px;margin-left:6px}
.lbl.say{background:#EAF0FB;color:#2B4C8C}
.lbl.inf{background:var(--line-soft);color:var(--muted)}

.player{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin:8px 0 6px}
.player .r{display:flex;align-items:center;gap:10px}
.player .pp{width:30px;height:30px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:12px}
.player .time{font-size:13px}
.player select{margin-left:auto;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px;padding:2px 4px;background:var(--paper)}
.prog{height:6px;background:var(--line-soft);border-radius:3px;margin-top:10px;cursor:pointer;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:3px}
.recog{font-size:12px;color:#2E8A62}
.curchap{font-size:12px;color:var(--faint);margin-bottom:4px}
.tpane{height:452px;overflow:auto;position:relative;padding-right:4px}
.line{padding:7px 10px;border-radius:8px;cursor:pointer}
.line:hover{background:var(--line-soft)}
.line .n{display:flex;justify-content:space-between;font-size:12.5px}
.line .n b{border-bottom:1px dotted var(--faint);cursor:text}
.line .n span{color:var(--faint)}
.line.cur{background:#FFF1B8}
.line.flash{animation:flash 2s ease}
@keyframes flash{0%,60%{background:#CFE8DD}100%{background:transparent}}
.twrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.follow{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;
  background:var(--ink);color:#fff;padding:7px 14px 7px 11px;font-size:12.5px;box-shadow:0 6px 18px rgba(30,43,47,.22);animation:fin .16s ease}
.follow:hover{background:var(--brand)}
.follow svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes fin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
.rename{font:inherit;font-size:12.5px;width:7em;border:1px solid var(--brand);border-radius:4px;padding:0 4px}
@media (max-width:1100px){.d1,.d2{grid-template-columns:1fr}}

/* ============ 分页组件 ============ */
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--muted)}
.filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;background:var(--paper);color:var(--ink)}
.pager{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.pager .total{margin-right:auto}
.pager .pg{min-width:30px;height:30px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:0 8px}
.pager .pg[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.pager .pg:disabled{opacity:.4;cursor:not-allowed}
.pager .pg:not(:disabled):not([aria-current="page"]):hover{border-color:var(--brand);color:var(--brand)}
.pager .dots{padding:0 4px}
.pager select,.pager input{border:1px solid var(--line);border-radius:6px;height:30px;font:inherit;background:var(--paper);color:var(--ink)}
.pager input{width:48px;text-align:center}

/* 顶栏身份胶囊与案场切换 */
.userbar{display:flex;align-items:center;gap:14px;position:sticky;top:40px;z-index:15;background:var(--canvas);
  margin:-22px -28px 16px;padding:12px 28px;border-bottom:1px solid var(--line)}
.ub-title{display:flex;align-items:baseline;gap:12px;min-width:0}
.ub-title h1{margin:0;font-size:20px;font-weight:700;white-space:nowrap}
.ub-sub{color:var(--muted);font-size:13px;white-space:nowrap}
.userbar .device,.userbar .period{flex:none}
th{white-space:nowrap}
td .go{white-space:nowrap}
/* 顶栏始终一行：窄屏时逐级收起次要信息，而不是换行 */
.userbar{flex-wrap:nowrap;min-width:0}
.userbar .who{flex:none;white-space:nowrap}
.device{white-space:nowrap;flex:none}
@media (max-width:1280px){.device>span:nth-child(n+3){display:none}}
@media (max-width:1000px){.ub-sub{display:none}.device>span:nth-child(2){display:none}.who .ub-div,.who .ub-site{display:none}}
.userbar .grow{flex:1}
.who .ub-div{width:1px;height:16px;background:var(--line);margin:0 2px 0 6px}
.ub-site{color:var(--muted)}
.ub-switch{display:inline-flex;align-items:center;border-radius:999px;padding:2px 4px;cursor:pointer}
.ub-switch:hover{background:var(--brand-soft)}
.ub-switch select{border:0;background:transparent;font:inherit;font-weight:600;color:var(--brand-ink);cursor:pointer;padding:0 2px}

/* ============ 家庭档案 ============ */
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px}
.tl-dot{position:absolute;left:-19px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--brand)}
.tl-item.next .tl-dot{background:var(--brand)}
.tl-item.next{background:var(--brand-soft);border-radius:var(--r-md);padding:10px 12px;margin:0 0 18px -6px}
.tl-item.next .tl-dot{left:-13px;top:15px}
.tl-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-who{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.tl-row{display:grid;grid-template-columns:2.4em 1fr;gap:8px;font-size:13.5px;margin-top:3px}
.k{color:var(--faint);font-size:12.5px}
.mchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--mc);color:var(--mc);border-radius:999px;padding:0 8px;font-size:12.5px;line-height:22px;font-weight:600}
.mchip small{font-weight:400;opacity:.8}
.nx{padding:10px 0;border-top:1px solid var(--line-soft)}
.nx:first-of-type{border-top:0}
.nx-for{font-size:12.5px;color:var(--muted)}
.nx .t{font-weight:600}
.nx .d,.iss .d{font-size:13px;color:var(--muted)}
.iss{padding:9px 0;border-top:1px solid var(--line-soft)}
.iss:first-of-type{border-top:0}
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%}
.dot.hollow{background:transparent;border:2px dashed}
.mf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.mf-h{margin-bottom:6px}
.mf-item{padding:7px 0;border-top:1px solid var(--line-soft);font-size:13px}
.mf-item .q{color:var(--ink);margin:2px 0}
@media (max-width:1100px){.mf{grid-template-columns:1fr}}

/* ============ 管理员看板网格 ============ */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:stretch}
.c-7{grid-column:span 7}.c-5{grid-column:span 5}
.dash .brief{margin:0}
.kpi-panel{display:flex;flex-direction:column;gap:12px;padding:14px}
.kt{border:1px solid var(--line-soft);background:var(--paper);border-radius:var(--r-md);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.kt:hover{border-color:var(--brand);background:var(--brand-soft)}
.kt .l{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.kt .v{font-size:24px;font-weight:700;line-height:1.25;white-space:nowrap}
.kt .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.kt .s{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kt-body{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end}
.kt-body .v{font-size:32px}
.kt-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bars2{display:grid;gap:2px}
.bar2{display:grid;grid-template-columns:1fr auto;gap:3px 10px;border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:8px}
.bar2:hover{background:var(--brand-soft)}
.bar2 .bl{font-size:13.5px}
.bar2 .c{font-weight:600;font-size:13px}
.bar2 .track{grid-column:1 / 3;height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.bar2 .fill{display:block;height:100%;background:var(--brand);border-radius:4px}
.bar2 .q{grid-column:1 / 3;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tight td,table.tight th{padding-left:5px;padding-right:5px}
@media (max-width:1180px){.c-7,.c-5{grid-column:1 / -1}}

/* ============ 通用：页签、状态、弹窗、查询表单 ============ */
.seg2{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.seg2 button{border:0;background:transparent;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg2 button[aria-selected="true"]{color:var(--ink);font-weight:650;border-color:var(--brand)}
.st{display:inline-block;font-size:12px;border-radius:999px;padding:0 8px;line-height:20px;background:var(--line-soft);color:var(--muted)}
.st.on{background:var(--brand-tint);color:var(--brand-ink)}
.st.off{background:#EEF0EF;color:var(--faint)}
.st.warn{background:var(--warn-tint);color:var(--warn)}
.ops-cell{white-space:nowrap}
.ops-cell .go{margin:0 10px 0 0}
td.empty{text-align:center;color:var(--faint);padding:28px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.qform{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 20px;margin-bottom:16px;align-items:center;
  padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
.qi{display:grid;grid-template-columns:5.2em minmax(0,1fr);align-items:center;gap:8px;font-size:13px;position:relative}
.qi-2{grid-column:span 2}
.ql{color:var(--muted);text-align:right;white-space:nowrap}
.ql.req::before,.fld .req::before{content:"*";color:#D14343;margin-right:3px}
.qi input,.qi select{border:1px solid var(--line);border-radius:8px;height:32px;padding:0 8px;font:inherit;font-size:13px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.qi .range{display:flex;align-items:center;gap:6px}
.qi .range i{font-style:normal;color:var(--faint)}
.qi .ferr{position:absolute;left:calc(5.2em + 8px);top:100%;margin-top:1px}
.qbtns{display:flex;gap:8px;justify-content:flex-end;grid-column:-2 / -1}
@media (max-width:1180px){.qform{grid-template-columns:repeat(2,minmax(0,1fr))}.qbtns{grid-column:1 / -1}}
.filters input{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;background:var(--paper)}
.mmask{position:fixed;inset:0;background:rgba(30,43,47,.32);z-index:50;display:grid;place-items:center;padding:20px}
.mmask[hidden]{display:none}
.modal{background:var(--paper);border-radius:14px;width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(30,43,47,.2)}
.modal header{display:flex;align-items:center;padding:16px 20px 8px}
.modal header h3{margin:0;font-size:17px;flex:1}
.modal header .x{border:0;background:transparent;font-size:20px;color:var(--faint)}
.mbody{padding:6px 20px 12px;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line-soft);align-items:center}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;color:var(--ink);background:var(--paper)}
.fld input[readonly]{background:var(--canvas);color:var(--muted)}
.fld .err,.fld input.err,select.err{border-color:var(--warn)}
.ferr{font-style:normal;font-size:12px;color:var(--warn)}
.pwd{font-size:22px;font-weight:700;letter-spacing:.06em;background:var(--brand-soft);border-radius:10px;padding:10px 14px;margin:8px 0}
.steps{display:flex;gap:18px;margin-bottom:14px;font-size:13px;color:var(--faint)}
.steps .cur{color:var(--brand-ink);font-weight:650}
.steps .done{color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:26px;text-align:center;display:grid;gap:6px;justify-items:center}
.qtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
.qbig{font-size:30px;font-weight:700;margin:4px 0}
.qmeta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qbuy{margin-top:10px;font-size:13px;background:var(--brand-soft);border-radius:8px;padding:6px 10px}
.qstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.qstats div{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line-soft);border-radius:10px;padding:8px 10px}
.qstats b{font-size:17px;white-space:nowrap}
.umenu{position:fixed;z-index:45;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(30,43,47,.12);padding:6px;min-width:160px}
.umenu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px}
.umenu button:hover{background:var(--brand-soft)}
.who{cursor:pointer}
@media (max-width:1100px){.qtop{grid-template-columns:1fr}}

/* ============ 登录 ============ */
body.is-login .app{grid-template-columns:1fr}
body.is-login .side{display:none}
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:600px;max-width:1080px;margin:24px auto 0;background:var(--paper);
  border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lbrand{background:var(--brand);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:48px 56px;gap:10px}
.lmark{width:56px;height:56px;border-radius:16px;background:#fff;color:var(--brand);display:grid;place-items:center;font-size:28px;font-weight:700}
.lname{font-size:36px;font-weight:700;letter-spacing:.04em;margin-top:8px}
.lslogan{font-size:18px;opacity:.85}
.lform{padding:56px 64px;display:flex;flex-direction:column;justify-content:center;max-width:500px;width:100%;margin:0 auto}
.lform h2{margin:0 0 4px;font-size:22px}
.lsub{margin:0 0 6px;color:var(--muted);font-size:13px}
.lbar{border-radius:8px;padding:7px 12px;font-size:13px;margin:10px 0 2px}
.lbar.red{background:#FCECEC;color:#B42318}
.lbar.gray{background:var(--line-soft);color:var(--muted)}
.lf{display:flex;flex-direction:column;gap:5px;margin-top:16px;font-size:13px;color:var(--muted)}
.lf .pw{position:relative;display:flex;gap:8px}
.lf input{flex:1;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 40px 0 12px;font:inherit;font-size:14px;color:var(--ink);min-width:0}
.lf input.err{border-color:#D14343}
.lf .ferr{color:#D14343}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:30px;height:30px;color:var(--faint)}
.eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.eye.on .slash{display:none}
.smsbtn{flex:none;border:1px solid var(--brand);color:var(--brand);background:var(--paper);border-radius:8px;padding:0 12px;font-size:13px;white-space:nowrap}
.smsbtn:disabled{border-color:var(--line);color:var(--faint);cursor:not-allowed}
.lf .pw:has(.smsbtn) input{padding-right:12px}
.lrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px}
.ck{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.ck input{width:16px;height:16px;accent-color:var(--brand)}
.agree{margin-top:12px;flex-wrap:wrap}
.agree.bad,.agree.bad .lk{color:#D14343}
.lk{border:0;background:transparent;color:var(--brand);padding:0;font-size:13px;cursor:pointer}
.lbtn{height:42px;margin-top:18px;font-size:15px;border-radius:10px;width:100%}
.lback{margin-top:12px;align-self:center}
.lnotes{max-width:1080px;margin:16px auto 0}
@media (max-width:900px){.login{grid-template-columns:1fr}.lbrand{padding:28px}}

.vis{display:inline-flex;align-items:baseline;gap:3px;margin:0 8px 2px 0;white-space:nowrap}
.vis small{font-size:11.5px;color:var(--faint)}
/* ============ 客户：列表 + 档案 ============ */
.cl{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.cl-list{position:sticky;top:104px;max-height:calc(100vh - 120px);display:flex;flex-direction:column;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cl-search{display:flex;gap:6px;padding:12px 12px 8px}
.cl-search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:inherit;font-size:13px}
.cl-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px;border-bottom:1px solid var(--line-soft)}
.chipf{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted);display:inline-flex;gap:5px}
.chipf span{color:var(--faint)}
.chipf[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chipf[aria-pressed="true"] span{color:#D6EDE4}
.cl-cards{overflow-y:auto;padding:6px}
.fcard{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 12px;margin-bottom:1px}
.fcard:hover{background:var(--brand-soft)}
.fcard.sel{background:var(--brand-tint);border-color:#C9E2D8}
.fc-h{display:flex;align-items:center;gap:8px}
.fc-h b{font-size:14.5px}
.fc-h .k{flex:1}
.fc-v{font-size:12.5px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-v b{color:var(--ink)}
.fc-m{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;margin-top:4px;font-weight:600}
.fc-m small{font-weight:400;color:var(--faint);margin-left:2px}
.fc-p,.fc-a{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-detail{min-width:0;container-type:inline-size}
.cl-head{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:14px}
.cl-head>div:first-child{flex:1;min-width:0}
.cl-head h2{margin:0 0 4px;font-size:19px}
.cl-head .ops{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@container (max-width:900px){
  .cl-detail .g-adv-1{grid-template-columns:1fr}
  .cl-detail .mf{grid-template-columns:1fr}
}
@container (max-width:600px){.cl-head{flex-direction:column}}
@media (max-width:1100px){.cl{grid-template-columns:1fr}.cl-list{position:static;max-height:none}}

/* ============ 简报条目 ============ */
.blist{display:grid}
.bitem{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:11px 0;border-top:1px solid var(--line-soft)}
.bitem:first-child{border-top:0;padding-top:4px}
.bn{color:var(--brand);font-weight:700;font-size:14px;align-self:start;padding-top:2px}
.bt1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bt1 b{font-size:15px;font-weight:600;color:var(--ink)}
.btx{margin:3px 0 0;font-size:14px;line-height:1.6;color:var(--ink);font-weight:400}
.bact{display:flex;gap:8px;align-items:center;justify-content:flex-end;white-space:nowrap}
.bact .ev{margin:0}
.brief .tag{flex:none}
@container (max-width:560px){.bitem{grid-template-columns:22px minmax(0,1fr)}.bact{grid-column:2;justify-content:flex-start}}
.brief{container-type:inline-size}
/* 图表悬浮提示 */
.ctip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.55;
  box-shadow:0 8px 20px rgba(30,43,47,.18);max-width:260px}
.ctip b{font-weight:650}
.ctip .cs{color:#C9D4D1;display:flex;align-items:center;gap:6px}
.ctip b{display:flex;align-items:center;gap:6px}
.ctip .sw{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.chart .cg{cursor:default}
.chart .cg:hover rect:not([fill="transparent"]){opacity:.82}
.dot[data-tip]{cursor:default}
/* ============ 顾问看板图表 ============ */
.c-4{grid-column:span 4}.c-12{grid-column:1 / -1}
.chartcard{display:flex;flex-direction:column;min-height:236px}
.cc-num{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.cc-num b{font-size:28px;font-weight:700;line-height:1.2}
.cc-num>span:not(.legend){color:var(--muted);font-size:13px}
.cc-num .legend{margin-left:auto}
.cc-chart{flex:1;display:flex;align-items:flex-end}
/* 环形图 */
.donut2{position:relative;width:132px;height:132px;margin:2px auto 8px}
.donut2 svg{width:100%;height:100%}
.donut2 circle[data-tip]{cursor:default}
.donut2 .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut2 .dc b{font-size:24px;font-weight:700;line-height:1.1}
.donut2 .dc span{font-size:12px;color:var(--muted)}
.dlegend{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.dlegend span{display:flex;align-items:center;gap:6px}
.dlegend i{width:9px;height:9px;border-radius:2px;flex:none}
.dlegend b{margin-left:auto;color:var(--ink);font-weight:600}
/* 堆叠条 */
.stack{display:flex;gap:3px;height:22px;border-radius:6px;overflow:hidden;margin:10px 0 14px}
.stack button{border:0;padding:0;min-width:6px;cursor:pointer}
.stack button:hover{filter:brightness(1.08)}
.slegend{display:grid;gap:2px}
.slegend button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:5px 6px;border-radius:6px;font-size:13px;text-align:left;color:var(--ink)}
.slegend button:hover:not(:disabled){background:var(--brand-soft)}
.slegend button:disabled{color:var(--faint);cursor:default}
.slegend i{width:10px;height:10px;border-radius:2px;flex:none}
.slegend b{margin-left:auto;font-weight:600}
/* 今日日程时间轴 */
.sch-axis{position:relative;height:16px;font-size:11px;color:var(--faint);margin:2px 8px 0}
.sch-axis span{position:absolute;transform:translateX(-50%)}
.sch-track{position:relative;height:28px;margin:4px 8px 14px}
.sch-track::before{content:"";position:absolute;left:0;right:0;top:13px;height:2px;background:var(--line);border-radius:1px}
.sch-past{position:absolute;left:0;top:13px;height:2px;background:#B9C6C2}
.sch-now{position:absolute;top:2px;width:2px;height:24px;background:#D14343;transform:translateX(-1px);border-radius:1px}
.sch-dot{position:absolute;top:7px;width:14px;height:14px;border-radius:50%;transform:translateX(-7px);border:2px solid var(--paper);padding:0;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.sch-dot.done{background:#7FB8A3}
.sch-dot.next{background:var(--brand);width:18px;height:18px;top:5px;transform:translateX(-9px);box-shadow:0 0 0 3px var(--brand-tint)}
.sch-dot.todo{background:#D9A441}
.sch-list{display:grid;gap:2px}
.sch-item{display:grid;grid-template-columns:44px auto 1fr;gap:8px;align-items:center;border:0;background:transparent;padding:6px 8px;border-radius:8px;text-align:left;font-size:13.5px}
.sch-item:hover{background:var(--brand-soft)}
.sch-item.done{color:var(--muted)}
.sch-item.done b{font-weight:500}
.sch-item.next{background:var(--brand-soft)}
/* 工作回顾 */
.rvgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.rvstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rvstats div{border:1px solid var(--line-soft);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.rvstats .sv{display:flex;align-items:baseline;gap:3px;white-space:nowrap;margin-top:2px}
.rvstats b{font-size:20px;font-weight:700;line-height:1.3;white-space:nowrap}
.rvstats small,.qstats small,.qbig small{font-size:12px;font-weight:500;color:var(--muted);margin:0 2px}
.rvstats-row{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:12px}
.rvcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rvcards-page{margin-top:16px}
.rvcard{border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px;background:var(--paper)}
.rvh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rvh .meta{margin-left:auto}
.rvrow{display:grid;grid-template-columns:42px auto 1fr;gap:8px;align-items:start;width:100%;border:0;background:transparent;text-align:left;padding:5px 4px;border-radius:6px;font-size:13px}
.rvrow:hover{background:var(--brand-soft)}
.rvt{line-height:1.5}
.rvnav{display:flex;align-items:center;gap:8px}
.rvnav input{border:1px solid var(--line);border-radius:8px;height:32px;padding:0 8px;font:inherit}
@media (max-width:1180px){.c-4{grid-column:1 / -1}.rvgrid{grid-template-columns:1fr}}

.ub-back{border:0;background:transparent;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink);margin-right:-4px}
.ub-back:hover{background:var(--brand-soft);color:var(--brand)}
.ub-back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ub-title{align-items:center}
.cc-num>b,.rvs b,.kt .l,.rvstats .k,.qstats .k{white-space:nowrap}
.cc-num>span{white-space:nowrap}
/* ============ 接待纪要框架 ============ */
.fw{padding:12px 0 14px;border-top:1px solid var(--line-soft)}
.fw:first-child{border-top:0;padding-top:4px}
.fw h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:14px;font-weight:650}
.fwn{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--brand-tint);color:var(--brand-ink);font-size:11px;font-weight:700}
.fw-empty{margin:0;color:var(--faint);font-size:13px}
.fw-kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 10px;font-size:13.5px;align-items:baseline}
.fw-need{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13.5px}
.fw-need>div{display:grid;grid-template-columns:4.5em 1fr;gap:10px;align-items:baseline}
.fw-need>div.none span:last-child{color:var(--faint)}
.fw-need .tag{margin-left:6px;font-size:11px;padding:0 5px}
.fw-gap{margin:10px 0 0;font-size:12.5px;color:var(--warn);background:var(--warn-tint);border-radius:8px;padding:5px 10px}
.fw-route{display:flex;align-items:stretch;gap:0}
.fw-route>div{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;min-width:0}
.fw-route>div b{display:block;font-size:13px}
.fw-route>div p{margin:3px 0 0;color:var(--ink);font-size:12.5px;line-height:1.5}
.fw-route>div.off{background:var(--canvas);border-style:dashed;color:var(--faint)}
.fw-route>i{flex:none;width:14px;align-self:center;height:1px;background:var(--line)}
.fw-t{font-size:13px}
.fw-t td{padding:6px 6px;vertical-align:baseline}
.fw-t td:first-child{padding-left:0;white-space:nowrap}
.fw-li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0}
.chap[data-chap]{cursor:pointer}
.chap[data-chap]:hover{background:var(--brand-tint)}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.crumb .ub-back{width:26px;height:26px;margin-left:-6px}
.crumb .ub-back svg{width:18px;height:18px}
.crumb-p{margin:0;color:var(--muted);text-decoration:none}
.crumb-p:hover{color:var(--brand);text-decoration:underline}
.crumb-c{color:var(--ink);font-weight:600}
.crumbrow{margin:0 0 12px}
.segp{margin-left:auto;display:inline-flex;background:var(--canvas);border-radius:8px;padding:2px;gap:2px}
.segp button{border:0;background:transparent;border-radius:6px;padding:2px 10px;font-size:12.5px;color:var(--muted)}
.segp button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(30,43,47,.12)}
/* 接待列表：行悬停 + 概要卡 */
tbody tr:hover td{background:var(--brand-soft)}
.sumcell{cursor:default;text-decoration:underline dotted var(--faint);text-underline-offset:4px}
.spop{position:fixed;z-index:55;width:360px;background:var(--paper);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 32px rgba(30,43,47,.16);padding:12px 14px;font-size:13px;animation:fin2 .14s ease}
@keyframes fin2{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.spop .sp-h{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.spop dl{display:grid;grid-template-columns:max-content 1fr;gap:5px 10px;margin:0}
.spop dt{color:var(--faint)}
.spop dd{margin:0}
.spop .sp-f{margin-top:8px;padding-top:7px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--faint)}
.spop dt,.ov dt,.prep dt,.fw-kv>.k,.tl-row>.k,.fw-need .k{white-space:nowrap}
/* 顾问看板一屏布局：页签卡片 */
.tabcard{display:flex;flex-direction:column;min-height:0;padding-top:10px}
.ctabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:8px;flex:none}
.ctabs button{border:0;background:transparent;padding:6px 0 9px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px;display:inline-flex;align-items:center;gap:5px}
.ctabs button[aria-selected="true"]{color:var(--ink);font-weight:650;border-color:var(--brand)}
.ctabs .cnt{font-size:11.5px;background:var(--line-soft);color:var(--muted);border-radius:999px;padding:0 6px;line-height:18px}
.ctabs button[aria-selected="true"] .cnt{background:var(--brand-tint);color:var(--brand-ink)}
.tabbody{flex:1;min-height:0;overflow:auto;padding-right:4px}
.tabbody .rec{padding:9px 0}
.tabbody .rec p{margin:3px 0 0}
.cc-chart.tall{margin-top:10px;display:block}
.dwrap{display:grid;place-items:center;padding-top:8px}
.dwrap .donut2{width:150px;height:150px}
.dwrap .dlegend{width:100%;max-width:340px}
.rvmini .rvrow{display:grid;grid-template-columns:44px auto auto minmax(0,1fr);gap:8px;align-items:baseline;width:100%;border:0;background:transparent;text-align:left;padding:7px 4px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.rvmini .rvrow:hover{background:var(--brand-soft)}
.rvmini .rvt{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adv1 .brief .bitem{padding:8px 0}
.adv1 .sch-list .sch-item{padding:4px 6px}
@media (max-width:1180px){.adv1{grid-template-rows:auto}.tabcard{height:380px}}
.kt-head{display:flex;align-items:baseline;gap:10px}
.kt-head .v{font-size:28px}
.kt-top{align-items:flex-start}
.kt-chart{margin-top:6px}
.stcard{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:14px}
.stcard .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--line-soft);color:var(--muted);flex:none}
.stcard.warn{background:var(--warn-tint);border-color:#F1D9C7}
.stcard.warn .ic{background:var(--warn);color:#fff}
.stcard .tx{flex:1}
.stcard .tx div{font-size:13px;color:var(--muted);margin-top:2px}
.skel{display:grid;gap:12px;padding-top:6px}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line-soft),#F5F8F7,var(--line-soft));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
.dhead h1 .tag{font-size:12px;font-weight:500}
.pagebar{display:flex;align-items:center;gap:8px}
.pagebar .sp{flex:1}
.dhead h1{margin-top:0}
/* 发言人选择卡 */
.spkpop{position:fixed;z-index:58;width:340px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 36px rgba(30,43,47,.18);padding:10px;animation:fin2 .14s ease}
.spq{width:100%;border:0;border-bottom:1px solid var(--line-soft);padding:6px 6px 10px;font:inherit;font-size:13.5px;outline:none;color:var(--ink)}
.sp-sec{font-size:12px;color:var(--faint);padding:10px 6px 4px}
.spo{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:7px 6px;border-radius:8px;text-align:left;font-size:13.5px}
.spo:hover,.spo.on{background:var(--brand-soft)}
.spo .av{width:26px;height:26px;border-radius:7px;background:var(--brand-tint);color:var(--brand-ink);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.spo .nm{font-weight:600}
.spo .tag{font-size:11px;padding:0 6px}
.spo .ck2{margin-left:auto;width:16px;height:16px;stroke:var(--brand);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sp-ft{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line-soft);margin-top:8px;padding:10px 6px 2px;font-size:12.5px}
.sp-ft .btn{margin-left:auto}
.sp-ft .ck{white-space:nowrap;flex:none}
.sp-ft .ck input{width:14px;height:14px}
/* 带撤销的提示条 */
.toastu{position:fixed;left:50%;top:70px;transform:translate(-50%,-10px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;
  background:#2B3436;color:#fff;border-radius:999px;padding:9px 18px 9px 12px;font-size:13.5px;box-shadow:0 10px 26px rgba(30,43,47,.25);transition:.18s;z-index:62}
.toastu.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toastu .okic{width:20px;height:20px;fill:#2EAD6B;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toastu button{border:0;background:transparent;color:#7FD3B0;font:inherit;font-weight:600;padding:0;margin-left:4px}
.line .n b[data-rename]{cursor:pointer;border-radius:4px;padding:0 3px;margin-left:-3px}
.line .n b[data-rename]:hover{background:var(--brand-tint)}
.sp-rel{padding:8px 6px 4px;display:grid;gap:6px}
.sp-rel>div{display:flex;flex-wrap:wrap;gap:6px}
.modal{width:min(640px,100%)}
.mtab{display:grid;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px}
.mrow{display:grid;grid-template-columns:62px 1fr 1.2fr 1fr 22px;gap:8px;align-items:center}
.mrow.mh{font-size:12px;color:var(--faint)}
.mrow input:not([type=radio]),.mrow select{border:1px solid var(--line);border-radius:8px;height:32px;padding:0 8px;font:inherit;font-size:13px;min-width:0;width:100%;background:var(--paper)}
.mr-main{display:grid;place-items:center}
.mr-self{padding-left:8px}
.mr-del{border:0;background:transparent;color:var(--faint);font-size:18px;padding:0}
.relsel{border:1px solid var(--line);border-radius:8px;height:30px;padding:0 6px;font:inherit;font-size:13px;background:var(--paper);max-width:100%}
.dupbar{margin:4px 0 12px;border-radius:8px;padding:8px 12px;font-size:13px;background:var(--line-soft)}
.dupbar.strong{background:var(--warn-tint);color:var(--warn)}
.lk-q{width:100%;border:1px solid var(--line);border-radius:8px;height:34px;padding:0 10px;font:inherit;font-size:13px}
.lk-list{display:grid;gap:2px;margin-top:8px;max-height:260px;overflow:auto}
.lk-item{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;text-align:left;font-size:13.5px}
.lk-item:hover,.lk-item.on{background:var(--brand-soft)}
.lk-item.on{border-color:#C9E2D8}
.lk-item .ck2{margin-left:auto;width:16px;height:16px;stroke:var(--brand);fill:none;stroke-width:2.2}
.lk-new{border-top:1px dashed var(--line);border-radius:0 0 8px 8px;color:var(--brand)}
.lk-vis{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.lk-vis .k{margin-left:4px}
.go.linkable{margin:0;color:var(--warn);text-decoration-style:dashed}
.pane-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding-top:12px;margin-top:4px;flex:none}
.pane-foot:empty{display:none}
.pane-foot .sp{flex:1}
.nf-name{display:grid;grid-template-columns:auto auto 1fr;gap:12px;align-items:center;margin-bottom:14px;font-size:13.5px}
.nf-name b{font-size:15px}
.nf-name input{border:1px solid var(--line);border-radius:8px;height:32px;padding:0 8px;font:inherit;font-size:13px;min-width:0}
.mrow input.err{border-color:#D14343}
.combo{position:relative;min-width:0}
.combo-in{width:100%;border:1px solid var(--line);border-radius:8px;height:32px;padding:0 26px 0 8px;font:inherit;font-size:13px;background:var(--paper)}
.combo-ar{position:absolute;right:7px;top:50%;width:14px;height:14px;transform:translateY(-50%);stroke:var(--faint);fill:none;stroke-width:2;pointer-events:none}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:70;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(30,43,47,.16);
  max-height:220px;overflow:auto;padding:4px;min-width:160px}
.cg-h{font-size:11.5px;color:var(--faint);padding:6px 8px 2px}
.cg-o{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:5px 8px;font-size:13px}
.cg-o:hover,.cg-o.on{background:var(--brand-soft);color:var(--brand-ink)}
.cg-new{color:var(--brand);border-top:1px solid var(--line-soft);border-radius:0 0 6px 6px;margin-top:2px}
.sp-rel .combo{max-width:200px}
.modal:has(.combo){overflow:visible}
.mbody:has(.combo){overflow:visible}
.fc-h>*{white-space:nowrap}
.fc-h b{overflow:hidden;text-overflow:ellipsis;min-width:0}
.fc-h .tag{margin-left:auto}
.sg-due{display:flex;align-items:center;gap:8px;margin:6px 0 0 22px;font-size:12.5px}
.sg-due input{border:1px solid var(--line);border-radius:6px;height:26px;padding:0 6px;font:inherit;font-size:12.5px}
.done-sum{display:grid;gap:6px;justify-items:start;padding-top:4px}
.done-sum p{margin:0;font-size:13.5px}
.blist.bscroll{max-height:300px;overflow:auto;padding-right:4px}
.bempty{margin:8px 0 4px;color:var(--faint);font-size:13.5px}
.ho-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.ho-sum div{border:1px solid var(--line-soft);border-radius:10px;padding:8px 12px;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.ho-sum b{font-size:18px}
.ho-sum span{font-size:12.5px;color:var(--muted)}
.ho-row{margin-bottom:12px}
.ho-mode{display:flex;gap:18px;margin-bottom:8px}
.fld select#hoTo,.ho-bulk select,.ho-li select{border:1px solid var(--line);border-radius:8px;height:32px;padding:0 8px;font:inherit;font-size:13px;background:var(--paper)}
.ho-bulk{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ho-list{border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto}
.ho-li{display:grid;grid-template-columns:1fr auto 150px;gap:10px;align-items:center;padding:6px 10px;border-top:1px solid var(--line-soft);font-size:13.5px}
.ho-li:first-child{border-top:0}
.ho-rule{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.fam2{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.fam2 .brief{margin:0}
.famnext{display:flex;flex-direction:column;max-height:340px}
.famnext .tabbody{flex:1;overflow:auto}
.famnext .nx:first-of-type{padding-top:0}
.famtabs{height:350px}
.famtabs .tl{padding-top:4px}
.cl-detail .c-7,.cl-detail .c-5{grid-column:auto}
.fam2>.brief{grid-column:span 7}.fam2>.famnext{grid-column:span 5}.fam2>.famtabs{grid-column:1 / -1}
@container (max-width:620px){.fam2>.brief,.fam2>.famnext{grid-column:1 / -1}}
.fam2>.brief{grid-column:span 7}.fam2>.famnext{grid-column:span 5}
.famnext .nx{position:relative;padding-right:92px}
.famnext .nx .ops{position:absolute;right:0;top:10px;margin:0!important}
.famnext .nx .ops .btn{padding:3px 10px}
.famnext .nx .t{font-size:13.5px}
.famnext{max-height:none}
.fam2>.brief,.fam2>.famnext{height:272px;overflow:hidden}
.fam2>.brief{display:flex;flex-direction:column}
.fam2>.brief .blist{flex:1;overflow:auto}
.lname{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lname-sub{font-size:16px;font-weight:500;color:#fff;opacity:.85}
.lslogan{font-size:17px;opacity:.92;margin-top:2px}
.lsteps{margin-top:34px;display:grid;gap:0}
.lstep{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center}
.lstep b{display:block;font-size:15px}
.lstep span{display:block;font-size:13px;opacity:.75;margin-top:1px}
.lic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.lic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lline{display:block;width:1px;height:18px;background:rgba(255,255,255,.3);margin-left:20px}
/* 收起态：悬停菜单图标显示名称 */
.nav button{position:relative}
body.collapsed .nav button[data-label]:hover::after{content:attr(data-label);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;white-space:nowrap;padding:5px 10px;border-radius:6px;z-index:40;pointer-events:none;
  box-shadow:0 6px 16px rgba(30,43,47,.2)}
body.collapsed .navgrp:hover .grp[data-label]::after{display:none}
/* 工牌动态状态条 */
.live{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
  font:inherit;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer;transition:background .25s,border-color .25s,box-shadow .25s;animation:lvIn .28s cubic-bezier(.2,.9,.3,1.2)}
.live b{color:var(--ink);font-weight:600}
.live:hover{border-color:#C9D3D0}
@keyframes lvIn{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.lv-sep{width:1px;height:12px;background:var(--line)}
.lv-dot{width:8px;height:8px;border-radius:50%;flex:none}
.lv-dot.ok{background:#2E9E6E}
.lv-dot.rec{background:#E5484D;box-shadow:0 0 0 0 rgba(229,72,77,.5);animation:lvPulse 1.2s infinite}
@keyframes lvPulse{70%{box-shadow:0 0 0 7px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
.lv-rec{background:#FFF5F5;border-color:#F6C9CA}
.lv-time{color:#C4373C;font-weight:600}
.lv-wave{display:inline-flex;gap:2px;align-items:center;height:14px}
.lv-wave i{width:2.5px;border-radius:2px;background:#E5484D;animation:lvWave .9s ease-in-out infinite}
.lv-wave i:nth-child(1){animation-delay:0s}.lv-wave i:nth-child(2){animation-delay:.15s}.lv-wave i:nth-child(3){animation-delay:.3s}.lv-wave i:nth-child(4){animation-delay:.45s}.lv-wave i:nth-child(5){animation-delay:.6s}
@keyframes lvWave{0%,100%{height:4px}50%{height:14px}}
.lv-up,.lv-tr,.lv-gen{background:var(--brand-soft);border-color:#C9E2D8}
.lv-ic{width:16px;height:16px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lv-bar{width:70px;height:5px;border-radius:3px;background:#D7E9E1;overflow:hidden}
.lv-bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .6s}
.lv-spin{width:13px;height:13px;border-radius:50%;border:2px solid #BFDDD0;border-top-color:var(--brand);animation:lvRot .8s linear infinite;flex:none}
@keyframes lvRot{to{transform:rotate(360deg)}}
.lv-dots{display:inline-flex;gap:3px}
.lv-dots i{width:4px;height:4px;border-radius:50%;background:var(--brand);animation:lvDot 1s infinite}
.lv-dots i:nth-child(2){animation-delay:.2s}.lv-dots i:nth-child(3){animation-delay:.4s}
@keyframes lvDot{0%,100%{opacity:.25}50%{opacity:1}}
.lv-done{background:var(--brand);border-color:var(--brand);color:#D6EDE4;box-shadow:0 6px 18px rgba(15,107,82,.28)}
.lv-done b{color:#fff}
.lv-done .k{color:#CFE8DD}
.lv-ic.ok{stroke:#fff}
.lv-go{border:0;background:#fff;color:var(--brand-ink);border-radius:999px;padding:2px 10px;font:inherit;font-size:12.5px;font-weight:600;margin-left:2px}
.umenu.lm{min-width:300px;padding:8px}
.lm-h{font-size:12px;color:var(--faint);padding:2px 6px 6px}
.lm-row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:6px;border-radius:6px;font-size:13px}
.lm-row:hover{background:var(--brand-soft)}
.pv-btn{border:1px solid #4A5658;background:transparent;color:#D9E2E0;border-radius:6px;padding:3px 10px;font-size:12px}
.pv-btn:hover{background:#3A4547}
.lv-proc{background:var(--brand-soft);border-color:#C9E2D8}
.lv-steps{display:inline-flex;gap:4px;font-size:11.5px}
.lv-steps i{font-style:normal;color:#9FB8AE;padding:0 5px;border-radius:999px}
.lv-steps i.on{color:var(--brand)}
.lv-steps i.cur{background:#fff;color:var(--brand-ink);font-weight:600}
.lv-x{display:inline-flex;align-items:center;gap:6px;color:var(--brand-ink);font-weight:600;animation:lvIn .3s cubic-bezier(.2,.9,.3,1.2)}
.lv-x.lv-ok{background:var(--brand);color:#fff;border-radius:999px;padding:3px 4px 3px 9px;margin-right:-8px}
.lv-x.lv-ok .lv-ic{stroke:#fff}
.lv-x .lv-go{padding:1px 9px}
.brief{display:flex;flex-direction:column;min-height:0}
.brief .blist{flex:1;min-height:0;overflow:auto;padding-right:4px}
.adv1{grid-template-rows:300px 372px}
.dash>.brief.c-7{max-height:none}   /* same row as the data card: stretch to equal height instead of capping at 360px */
.fl-list{display:grid;gap:4px;max-height:280px;overflow:auto}
.fl-item{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line-soft);background:transparent;border-radius:10px;padding:9px 12px;text-align:left;font-size:13.5px}
.fl-item:hover{background:var(--brand-soft)}
.fl-item.on{border-color:var(--brand);background:var(--brand-soft)}
.fl-t{font-weight:600}
.fl-s{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lv-ring{width:17px;height:17px;flex:none}
.lv-ring circle{fill:none;stroke-width:3}
.lv-ring .tr{stroke:#CFE3DA}
.lv-ring .pg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dasharray .55s ease}
.lv-cnt{font-weight:600;color:var(--brand-ink);margin-left:-1px}
.idle-t td{padding:6px 8px;vertical-align:middle}
.idle-t th{padding:2px 8px 6px}
.idle-t td:first-child,.idle-t th:first-child{padding-left:2px}
.btn.sm{padding:2px 10px;font-size:12.5px}
[hidden]{display:none!important}
@media (max-width:1100px){
  .g-admin-1,.g-admin-2,.g-adv-1{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  ${note('<b>客户页改为“列表 + 档案”左右分栏</b>：同一家庭常有不同家人交叉来访、每次来意不同，这些是顾问最需要的信息，所以不再藏在点进去的二级页面里。左侧卡片只有两行：家庭名、来访次数、状态；最近来访日期和来意。状态只标需要行动的三种（今天到访 / 逾期 / 无下一步），其余不标；家庭成员和每人来访次数在右侧档案里看。次数再多卡片高度也不变；右侧直接显示选中家庭的完整档案。家人姓名、手机号都可以搜。<br><b>新增客户 = 新建家庭档案</b>：<b>家庭名称 = 主要联系人姓名</b>（如“张伟”），不再用“×先生家庭”；接待时只知道称呼可先填“张先生”，补全名后家庭名称同步更新；同名靠手机号查重和备注（如“学区三房”）区分；家庭成员（可多人，单选一位主要联系人，其余选与主要联系人的关系，手机号选填）。查重<b>只按手机号</b>（任一成员）精确匹配，命中提示“可能重复”并可查看该家庭；称呼、姓氏相同不提示；只提示不自动合并（PRD 4.2.5）。<b>绑定已有家庭</b>在接待侧完成：接待列表客户列的“待关联”（橙色可点）或待办的“关联”打开关联客户弹窗，可搜索已有家庭并勾选本次到访人，找不到时“新建家庭”并自动关联这次接待（PRD 4.2.6）客户档案头部的“关联接待”是反方向的同一件事：顾问记得这户今天来过、但那段录音还没归属时，从档案里认领；列表显示时间、时长、状态和摘要，AI 根据内容匹配时标“可能是这户”，不默认选中，须勾选本次到访人。。<br><b>关系字典</b>（相对主要联系人，可搜索的分组下拉；找不到可直接使用输入的文字，如“表哥”；可留空为“关系未确认”）：直系（配偶 / 父亲 / 母亲 / 儿子 / 女儿）、配偶家（岳父 / 公公、岳母 / 婆婆）、其他亲属（兄弟姐妹 / 祖辈 / 孙辈 / 其他亲属）、非亲属（朋友 / 同事 / 中介 / 代办 / 其他）。岳父和公公合并为一项，因为取决于主要联系人的性别，系统不做推断。')}`;
}

// 通用分页组件：共 N 条 | 每页条数 | 上一页 1 … 4 5 [6] 7 8 … 12 下一页 | 跳至 N 页
function pager(total, page, size, key='rp'){
  const pages = Math.max(1, Math.ceil(total/size));
  // 页码显示规则：始终显示首页、末页，以及当前页前后各 2 页；中间断开处用省略号
  const nums = [];
  for(let p=1;p<=pages;p++){ if(p===1||p===pages||Math.abs(p-page)<=2) nums.push(p); }
  const items = []; nums.forEach((p,i)=>{ if(i && p-nums[i-1]>1) items.push('…'); items.push(p); });
  return `<nav class="pager" aria-label="分页">
    <span class="total">共 <b class="num">${total}</b> 条</span>
    <select class="pg-size" data-pk="${key}" aria-label="每页条数">${PAGE_SIZES.map(n=>`<option value="${n}"${n===size?' selected':''}>${n} 条/页</option>`).join('')}</select>
    <button class="pg" type="button" data-pk="${key}" data-pg="${page-1}"${page<=1?' disabled':''} aria-label="上一页">‹</button>
    ${items.map(p=>p==='…'?'<span class="dots">…</span>':`<button class="pg num" type="button" data-pk="${key}" data-pg="${p}"${p===page?' aria-current="page"':''}>${p}</button>`).join('')}
    <button class="pg" type="button" data-pk="${key}" data-pg="${page+1}"${page>=pages?' disabled':''} aria-label="下一页">›</button>
    <span>跳至</span><input class="num pg-jump" data-pk="${key}" inputmode="numeric" aria-label="跳转页码"><span>页</span>
  </nav>`;
}

  // 只按手机号精确匹配（任一成员），命中才提示；称呼、姓氏重复很常见，不作为重复依据；不自动合并
  const known = { '13800001001':'陈建国', '13900007531':'刘洋', '13612342210':'高敏' };
  for(const m of nf.members){ const hit = /^1\d{10}$/.test(m.phone||'') && known[m.phone]; if(hit) return [hit, m.phone]; }
  return null;
}

  const main = nf.members[0];

function hoConfirm(){
  const a = ACCOUNTS.find(x=>x.user===ho.user), fams = FAMILIES.filter(f=>f[2]===a.name);
  const recv = pcOpts('adv', a.name).map(o=>o[0]);
  const target = f => { const t = ho.per ? ho.map[f[0]] : ho.to; return recv.includes(t) ? t : ''; };

  if(miss.length){ toast(ho.per ? `还有 ${miss.length} 户没有指定接收人` : '请选择接收人'); return; }

  const text=$('#tkText').value.trim(), d=$('#tkDate').value;

// ============ 顾问看板：图表为主 ============
const NOW = '13:42';
// 今日日程：接待（已完成）、复访（预约）、待办截止
const mins = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
function scheduleTrack(){
  const S=mins('08:00'), E=mins('19:00'), pos=t=>((mins(t)-S)/(E-S)*100).toFixed(2)+'%';
  const recs = RECORDS.filter(r=>r[1]==='王敏' && r[0].startsWith('11-19') && isRecp(r)).sort((a,b)=>a[0].localeCompare(b[0]));
  const due = ACTIONS.filter(a=>a.tag==='今日' && !done.has(a.id) && !a.later);      // 与“待办”页签同一份数据
  const recAct = r => `data-detail="${r[5]==='已生成' ? dId(r[0]) : 'st:'+ST_KEY[r[5]]+':'+r[0]}"`;
  const recTip = r => `{c:#0F6B52}${r[0].slice(6)}　接待|${r[3]}|${r[2]}　${r[5]}`;
  const dots = [
    ...recs.map(r=>({t:r[0].slice(6), kind:'done', act:recAct(r), tip:recTip(r)})),
    {t:'14:00', kind:'next', act:'data-prep', tip:'{c:#0F6B52}14:00　复访|陈建国|预计陈建国、李女士、陈叔'},
    ...(due.length ? [{t:'18:00', kind:'todo', act:'data-at="work:todo"', tip:`{c:#D9A441}今日到期|${due.length} 项待办|${due.map(a=>a.t).join('、')}`}] : [])
  ];
  return `<div class="sch">
    <div class="sch-axis">${[8,10,12,14,16,18].map(h=>`<span style="left:${pos(String(h).padStart(2,'0')+':00')}">${h}:00</span>`).join('')}</div>
    <div class="sch-track"><i class="sch-past" style="width:${pos(NOW)}"></i><i class="sch-now" style="left:${pos(NOW)}" data-tip="现在 ${NOW}"></i>
      ${dots.map(e=>`<button type="button" class="sch-dot ${e.kind}" style="left:${pos(e.t)}" ${e.act} data-tip="${e.tip}"></button>`).join('')}</div>
    <div class="sch-list">
      <button type="button" class="sch-item next" data-prep><span class="num">14:00</span><span class="tag solid">复访</span><b>陈建国</b></button>
      ${due.length ? `<button type="button" class="sch-item todo" data-at="work:todo" data-tip="今日到期|${due.map(a=>a.t).join('|')}"><span class="num">今日</span><span class="tag warn">待办到期</span><b>${due.length} 项</b></button>` : ''}
    </div>
  </div>`;
}

function myTrend(){
  const mine = RECORDS.filter(r=>r[1]==='王敏' && isRecp(r));
  const first = {}; [...mine].sort((a,b)=>a[0].localeCompare(b[0])).forEach(r=>{ if(r[3]!=='待关联' && !first[r[3]]) first[r[3]]=r[0]; });
  return ['11-13','11-14','11-15','11-16','11-17','11-18','11-19'].map(d=>{
    const day = mine.filter(r=>r[0].startsWith(d));

    return [d, nw, day.length-nw];
  });
}

// ============ 工牌状态条（顶栏） ============
// 常驻：工牌在线 / 电量 / 今日录音。有录音在处理时，末尾追加“进度环 + 转写中”；多段时显示 已完成/总数（如 1/3）
// 上传、转写、整理等中间步骤统一叫“转写中”；每完成一段，短暂提示“××接待的纪要已生成 查看”
const live = { total:1, done:0, cur:.4, flash:null, timer:null };   // 与接待列表一致：13:20 那段正在转写
const liveRec = () => RECORDS.filter(r=>r[1]==='王敏' && r[0].startsWith('11-19') && r[5]!=='设备待上传').length;
// 进度环 = （已完成段数 + 当前这段的估算进度）/ 总段数；估算进度只增不减，完成前最多到 95%
const livePct = () => live.total ? Math.min(100, Math.round((live.done + (live.done<live.total ? live.cur : 0)) / live.total * 100)) : 0;
const liveTip = () => `转写中|共 ${live.total} 段，已完成 ${live.done} 段|整体进度 ${livePct()}%`;
const liveKey = () => live.flash ? 'f'+live.flash : live.done<live.total ? 'p'+(live.total>1?'n':'1') : 'i';
function liveHtml(){
  const p = livePct();
  const extra = live.flash
    ? `<span class="lv-sep"></span><span class="lv-x lv-ok"><svg class="lv-ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>${live.flash} 接待的纪要已生成<button type="button" class="lv-go" data-detail="${dId('11-19 '+live.flash)}">查看</button></span>`
    : live.done<live.total
    ? `<span class="lv-sep"></span><span class="lv-x" id="lvX" data-tip="${liveTip()}"><svg class="lv-ring" viewBox="0 0 20 20" aria-hidden="true"><circle class="tr" cx="10" cy="10" r="7.5"/><circle class="pg" id="lvRing" cx="10" cy="10" r="7.5" pathLength="100" stroke-dasharray="${p} 100" transform="rotate(-90 10 10)"/></svg>转写中${live.total>1?`<span class="num lv-cnt" id="lvCnt">${live.done}/${live.total}</span>`:''}</span>`
    : '';
  return `<div class="live" id="liveBar" data-live data-key="${liveKey()}" role="button" tabindex="0" aria-live="polite"><span class="lv-dot ok"></span><b>工牌在线</b><span class="lv-sep"></span><span>电量 <b class="num">62%</b></span><span class="lv-sep"></span><span>今日录音 <b class="num" id="lvRec">${liveRec()}</b> 段</span>${extra}</div>`;
}
// 结构没变时只更新进度环和数字，让进度平滑前进；结构变化（出现 / 消失 / 完成提示）才整体重绘
function paintLive(){
  const el = $('#liveBar'); if(!el) return;
  const ring = $('#lvRing');
  if(ring && el.dataset.key===liveKey() && !live.flash){
    ring.setAttribute('stroke-dasharray', livePct()+' 100');
    const c=$('#lvCnt'); if(c) c.textContent = live.done+'/'+live.total;
    $('#lvX').dataset.tip = liveTip(); $('#lvRec').textContent = liveRec(); return;
  }
  el.outerHTML = liveHtml();
}
// 原型演示：又一段录音上传 → 两段排队转写（0/2 → 1/2）→ 全部完成（实际由处理进度驱动）
function simulateLive(){
  clearInterval(live.timer);
  const r1 = RECORDS.find(x=>x[0]==='11-19 13:20'), r2 = RECORDS.find(x=>x[0]==='11-19 13:35');
  r1[4]='—'; r1[5]='转写中'; r2[2]='—'; r2[3]='—'; r2[4]='—'; r2[5]='设备待上传';
  Object.assign(live, { total:1, done:0, cur:.4, flash:null });
  if(role!=='advisor' || page!=='home'){ role='advisor'; page='home'; document.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.role==='advisor')); render(); }
  else paintLive();
  let t=0;
  live.timer = setInterval(()=>{ t++;
    if(t===3){ r2[2]='22 分钟'; r2[3]='待关联'; r2[5]='转写中'; live.total=2; live.cur=.25; }      // 13:35 那段上传完成，加入转写
    if(t>3 && t<9) live.cur = Math.min(.95, live.cur+.15);
    if(t===9){ r1[5]='已生成'; r1[4]='首次到访，了解三房总价和车位'; live.done=1; live.cur=.05; live.flash='13:20'; }
    if(t===15) live.flash=null;                                                                       // 提示收回，继续显示 1/2
    if(t>15 && t<22) live.cur = Math.min(.95, live.cur+.16);
    if(t===22){ r2[5]='已生成'; r2[4]='首次到访，了解两房户型和首付'; live.done=2; live.flash='13:35'; }
    if(t===28){ Object.assign(live, { total:0, done:0, cur:0, flash:null }); clearInterval(live.timer); }
    paintLive(); }, 600);
}

    </section>

// 校验工具
const pwdRule = v => /^(?=.*[A-Za-z])(?=.*\d).{8,20}$/.test(v);
function startCd(){ lg.cd=60; clearInterval(cdTimer); cdTimer=setInterval(()=>{ lg.cd--; const b=document.querySelector('[data-sms]'); if(b){ b.textContent=lg.cd?lg.cd+' 秒后重发':'获取验证码'; b.disabled=!!lg.cd; } if(!lg.cd) clearInterval(cdTimer); },1000); }
function enterApp(r){ role=r; page='home'; document.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.role===r)); lg.bar=null; render(); window.scrollTo(0,0); }
function goLogin(bar){ role='login'; lg.step='login'; lg.bar=bar||null; lg.err={}; lg.agreeErr=false; document.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.role==='login')); render(); }

const LG = {
  submit(){
    const u=$('#lgUser').value.trim().toLowerCase(), p=$('#lgPwd').value; lg.user=$('#lgUser').value.trim(); lg.remember=$('#lgRemember').checked;
    lg.err={}; lg.bar=null; lg.agreeErr=false;
    if(!u) lg.err.lgUser='请输入账号名'; if(!p) lg.err.lgPwd='请输入密码';
    if(u&&p&&!$('#lgAgree').checked) lg.agreeErr=true;
    if(Object.keys(lg.err).length||lg.agreeErr) return render();
    const t=lg.tries[u]||0;
    if(t>=5){ lg.bar=['red','连续输错 5 次，请 15 分钟后再试']; return render(); }
    const acc=LOGIN_USERS[u];
    if(!acc || acc.pwd!==p){ lg.tries[u]=t+1; lg.bar = t+1>=5 ? ['red','连续输错 5 次，请 15 分钟后再试'] : ['red',`账号或密码错误，还可尝试 ${5-t-1} 次`]; return render(); }
    if(acc.off){ lg.bar=['red','账号已停用，请联系案场管理员']; return render(); }
    lg.tries[u]=0;
    if(acc.first){ lg.from=acc.role; lg.step='setpwd'; return render(); }
    enterApp(acc.role);
  },
  setpwd(){
    const a=$('#lgNew').value, b=$('#lgNew2').value; lg.err={}; lg.bar=null;
    if(!pwdRule(a)) lg.err.lgNew='密码需 8–20 位，包含字母和数字';
    else if(a==='Temp1234') lg.err.lgNew='新密码不能与当前密码相同';
    else if(a!==b) lg.err.lgNew2='两次输入的新密码不一致';
    if(Object.keys(lg.err).length) return render();
    lg.step='bindphone'; lg.cd=0; render();
  },
  sms(){
    const ph=$('#lgPhone').value.trim(); lg.err={};
    if(!/^1\d{10}$/.test(ph)){ lg.err.lgPhone='请输入11位大陆手机号'; const keep=ph; render(); $('#lgPhone').value=keep; return; }
    lg.bar=['gray', lg.step==='forgot1'?'如该手机号可用于找回，验证码将发送至该号码，请留意短信。':'验证码已发送']; const keep=ph; render(); $('#lgPhone').value=keep; startCd();
  },
  checkCode(next){
    const ph=$('#lgPhone').value.trim(), c=$('#lgCode').value.trim(); lg.err={};
    if(!/^1\d{10}$/.test(ph)) lg.err.lgPhone='请输入11位大陆手机号';
    else if(!/^\d{6}$/.test(c)) lg.err.lgCode='请输入6位短信验证码';
    if(Object.keys(lg.err).length){ render(); $('#lgPhone').value=ph; $('#lgCode').value=c; return; }
    next();
  },
  bind(){ LG.checkCode(()=>{ clearInterval(cdTimer); lg.cd=0; enterApp(lg.from||'advisor'); toast('✔ 密码设置成功'); }); },
  verify(){ LG.checkCode(()=>{ clearInterval(cdTimer); lg.cd=0; lg.step='forgot2'; lg.bar=null; render(); }); },
  reset(){
    const a=$('#lgNew').value, b=$('#lgNew2').value; lg.err={};
    if(!pwdRule(a)) lg.err.lgNew='密码需 8–20 位，包含字母和数字'; else if(a!==b) lg.err.lgNew2='两次输入的新密码不一致';
    if(Object.keys(lg.err).length) return render();
    lg.user='wangmin'; goLogin(['gray','密码已重置，请使用账号名和新密码登录']);
  }
};

// 堆叠柱状图（纯 SVG）；mini=true 时用于数字卡里的迷你趋势
// 按统计周期生成趋势：今日按 2 小时分段，本周按天（周一至今天），本月按周；各段之和与上方数字一致
const splitBy = (total, w) => { const sum=w.reduce((a,b)=>a+b,0); const out=w.map(x=>Math.floor(total*x/sum)); let r=total-out.reduce((a,b)=>a+b,0);
  const order=[...w.keys()].filter(i=>w[i]>0).sort((a,b)=>w[b]-w[a]); for(let i=0; r>0; i=(i+1)%order.length, r--) out[order[i]]++; return out; };
function periodTrend(p, k){
  const seg = p==='today' ? [['09','9 时','09:00–11:00',5],['11','11 时','11:00–13:00',6],['13','13 时','13:00–15:00（截至现在）',3],['15','15 时','15:00–17:00（未到）',0],['17','17 时','17:00–19:00（未到）',0]]
    : p==='week' ? [['11-16','周一','11-16 周一',9],['11-17','周二','11-17 周二',11],['11-18','周三','11-18 周三',15],['11-19','周四','11-19 周四（截至现在）',11]]
    : [['11-01','第 1 周','11-01 至 11-08',8],['11-09','第 2 周','11-09 至 11-15',10],['11-16','第 3 周','11-16 至 11-19（截至现在）',6]];
  const nv=splitBy(k.newv, seg.map(x=>x[3])), rv=splitBy(k.ret, seg.map(x=>x[3]));
  return seg.map((x,i)=>[x[0], nv[i], rv[i], x[1], x[2]]);
}
// 堆叠柱状图（含坐标轴）。size: 'mini' 用于数字卡内，'full' 用于独立图表卡
// 纵轴：自动取整刻度（≤ 4 档）+ 浅色网格线 + 单位“组”；横轴：日期 / 时段 / 周
function chart(size, data=TREND){
  const full = size==='full', wide = size==='wide';
  const W = full?520:wide?400:260, H = full?270:wide?150:120, L = full?34:28, R = 6, T = full?28:18, B = full?26:22;
  const fs = full?12.5:wide?12.5:11;   // 坐标文字字号（按容器实际宽度约 1:1 显示）
  const top = Math.max(1, ...data.map(d=>d[1]+d[2]));
  const step = [1,2,5,10,20,50,100].find(x=>top/x<=4) || 100, max = Math.ceil(top/step)*step;
  const ph = H-T-B, pw = W-L-R, slot = pw/data.length, bw = Math.min(full?40:26, slot*.56);
  const y = v => T + ph - ph*v/max;
  const ticks = []; for(let v=0; v<=max; v+=step) ticks.push(v);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="接待趋势">
    <text x="${L-6}" y="${T-12}" text-anchor="end" font-size="${fs}" fill="#8A9699">组</text>
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v?'#E6ECEA':'#C9D3D0'}" ${v?'stroke-dasharray="3 3"':''}/>
      <text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="${fs}" fill="#8A9699">${v}</text>`).join('')}
    ${data.map((d,i)=>{ const cx=L+slot*i+slot/2, x=cx-bw/2, h1=y(0)-y(d[1]), h2=y(0)-y(d[2]), tot=d[1]+d[2];
      const wk='日一二三四五六'[new Date('2026-'+d[0]).getDay()];
      const head = d[4] || `${d[0]} 周${wk}`;
      const lab = d[3] || d[0];
      return `<g class="cg" data-tip="${head}|{c:#0F6B52}新访 ${d[1]} 组|{c:#9CC7B6}复访 ${d[2]} 组|共 ${tot} 组">
      <rect x="${L+slot*i}" y="${T}" width="${slot}" height="${ph}" fill="transparent"/>
      ${d[1]?`<rect x="${x}" y="${y(d[1])}" width="${bw}" height="${h1}" fill="#0F6B52"/>`:''}
      ${d[2]?`<rect x="${x}" y="${y(d[1]+d[2])}" width="${bw}" height="${h2}" fill="#9CC7B6"/>`:''}
      ${full&&tot?`<text x="${cx}" y="${y(tot)-5}" text-anchor="middle" font-size="${fs}" fill="#5E6B6E">${tot}</text>`:''}
      <text x="${cx}" y="${H-6}" text-anchor="middle" font-size="${fs}" fill="#8A9699">${lab}</text></g>`; }).join('')}
  </svg>`;
}
